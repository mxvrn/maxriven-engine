<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>MAXRIVEN Engine</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050506'/%3E%3Cpath d='M12 46 L22 18 L32 36 L42 18 L52 46' fill='none' stroke='%238a5cff' stroke-width='6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/font.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="stage" class="stage">

    <!-- Ekran 1: wybór silnika -->
    <section id="pick" class="screen-pick">
      <header class="p-head">
        <div class="p-logo">MAXRIVEN <span>ENGINE</span></div>
        <div class="p-sub">Wybierz silnik</div>
      </header>
      <div class="p-cards" id="cards"></div>
      <button class="p-start" id="start">START</button>
      <div class="p-hint">Dźwięk włączy się po dotknięciu START · prędkość z GPS albo z symulatora</div>
    </section>

    <!-- Ekran 2: jazda -->
    <section id="drive" class="screen" hidden>
      <div class="scr-top">
        <div class="scr-logo">MAXRIVEN <span>ENGINE</span></div>
        <div class="scr-engine" id="engName"></div>
        <div class="seg"><button data-mode="gps">GPS</button><button data-mode="sim">SYMULATOR</button></div>
        <button class="btn-pill" id="openSound">DŹWIĘK</button>
        <div class="scr-status" id="status"></div>
      </div>
      <div class="scr-main"><svg id="cluster" class="cluster"></svg></div>
      <div class="scr-sim">
        <div class="slider"><label>PRĘDKOŚĆ DOCELOWA <b id="tgtLbl">0 km/h</b></label><input type="range" min="0" max="250" step="1" value="0" id="tgt"></div>
        <div class="slider"><label>GAZ <b id="gasLbl">50%</b></label><input type="range" min="0" max="100" step="1" value="50" id="gas"></div>
        <div class="scns" id="scns"></div>
      </div>
      <div class="scr-bottom">
        <button class="btn-stop" id="stop">STOP</button>
        <button class="btn-rev" id="rev">TRZYMAJ, ABY PRZEGAZOWAĆ</button>
      </div>

      <div class="sheet" id="sheet" hidden>
        <div class="sheet-box">
          <h2>Dźwięk</h2>
          <div class="slider"><label>GŁOŚNOŚĆ <b id="volLbl"></b></label><input type="range" min="0" max="100" step="1" id="vol"></div>
          <div class="slider"><label>BAS <b id="bassLbl"></b></label><input type="range" min="-6" max="9" step="1" id="bass"></div>
          <div class="switch-row"><div>Korekcja pod głośniki kabiny<small>mniej dudnienia, czytelniejszy środek, łagodniejsza góra</small></div><button class="switch" id="cabin" aria-label="Korekcja kabiny"></button></div>
          <button class="sheet-done" id="closeSound">GOTOWE</button>
        </div>
      </div>
    </section>

    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="js/presets.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/gps.js"></script>
  <script src="js/worklet.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/controller.js"></script>
  <script src="js/cluster.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
